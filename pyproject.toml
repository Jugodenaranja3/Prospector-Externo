[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector_externo"
version = "1.0.0"
description = "Prospector Externo y Catálogo de Fuentes Estatales Públicas — Equipo 1 DATAX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
browser = [
    "playwright>=1.40.0"
]
mongo = [
    "pymongo>=4.5.0"
]

[project.scripts]
prospector-batch = "apps.crawler_batch.main:main"
prospector-api = "apps.catalog_api.main:main"
prospector-project = "apps.datax_projection.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
