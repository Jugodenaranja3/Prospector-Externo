schema_version: b10-semantic-audit-policy-1.0

checkpoint_exit_code_is_not_sufficient_for_success: true

blocking_classifications:
  - CHECKPOINT_NOT_SUCCEEDED
  - PROCESS_OK_WITH_INTERNAL_ERROR
  - WORKFLOW_MISMATCH
  - WORKFLOW_NOT_OBSERVED
  - ZERO_RESOURCES_REVIEW
  - RESOURCE_COUNT_NOT_OBSERVED
  - MISSING_LOG_SEGMENT

error_signals:
  - TRACEBACK
  - UNCONTROLLED_WORKFLOW_ERROR
  - PARSER_REJECTED_MARKUP
  - UNICODE_ENCODE_ERROR
  - LOGGING_ERROR
  - EXPLICIT_ERROR_LOG

closure_rule:
  checkpoint_must_be_complete: true
  internal_errors_must_be_zero: true
  workflow_mismatches_must_be_zero: true
  zero_resource_sources_require_explicit_review: true
