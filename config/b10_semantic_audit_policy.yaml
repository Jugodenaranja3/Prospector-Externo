schema_version: b10-semantic-audit-policy-1.1

principle: absence_of_log_evidence_is_not_negative_execution_evidence

blocking_classifications:
  - CHECKPOINT_NOT_SUCCEEDED
  - PROCESS_OK_WITH_INTERNAL_ERROR
  - WORKFLOW_MISMATCH
  - ZERO_RESOURCES_REVIEW
  - MISSING_LOG_SEGMENT

warning_classifications:
  - WORKFLOW_NOT_OBSERVED_WARNING
  - RESOURCE_COUNT_NOT_OBSERVED_WARNING

policy:
  checkpoint_succeeded_is_required: true
  observed_internal_error_blocks: true
  observed_workflow_mismatch_blocks: true
  observed_zero_resources_requires_review: true
  missing_workflow_log_is_warning: true
  missing_resource_count_log_is_warning: true
